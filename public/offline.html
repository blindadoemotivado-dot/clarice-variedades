<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sem Conexão — Clarice Achadinhos</title>
  <meta name="theme-color" content="#FFE600" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 20px;
      border: 2px solid #FFE600;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #FFFFFF;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      color: #0F172A;
      background: #FFE600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
      text-decoration: none;
    }
    .btn:hover { background: #E6CF00; }
    .btn:active { transform: scale(0.98); }
    .badge {
      display: inline-block;
      margin-top: 16px;
      font-size: 11px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192x192.png" alt="Clarice Achadinhos" class="logo" />
    <h1>Você está offline</h1>
    <p>Parece que sua conexão com a internet caiu. Verifique sua rede Wi-Fi ou dados móveis para continuar conferindo as melhores ofertas do Mercado Livre.</p>
    <button class="btn" onclick="window.location.reload()">Tentar Novamente</button>
    <div class="badge">Clarice Achadinhos PWA</div>
  </div>
</body>
</html>
